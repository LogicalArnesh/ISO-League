<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISO PREMIER LEAGUE - OFFICIAL WEBSITE</title>
<style>body{margin:0;background:#060b14;color:#94a3b8;font-family:system-ui;display:flex;min-height:100vh;align-items:center;justify-content:center}#s{color:#34d399;font-weight:800}</style>
</head><body><div><div id="s">ISO Premier League</div><div>Loading…</div></div>
<script>
(async function(){
  const n = 4;
  let html = '';
  for (let i=0;i<n;i++){
    const r = await fetch('parts/p'+i+'.txt?v='+Date.now());
    if(!r.ok){ document.body.innerHTML = '<p style="color:#f43f5e">Failed to load part '+i+'</p>'; return; }
    html += await r.text();
  }
  document.open(); document.write(html); document.close();
})();
</script></body></html>
