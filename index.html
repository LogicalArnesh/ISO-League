<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ISO League</title>
<style>body{margin:0;background:#060b14;color:#e2e8f0;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}</style>
</head>
<body>
<p id="st">Loading ISO League…</p>
<script>
(async function(){
  const st = document.getElementById('st');
  const base = 'https://raw.githubusercontent.com/LogicalArnesh/ISO-League/main/';
  try {
    st.textContent = 'Downloading app…';
    let b64 = '';
    for (let i = 0; i < 12; i++) {
      st.textContent = 'Downloading… ' + (i+1) + '/12';
      const r = await fetch(base + 'c' + String(i).padStart(2,'0') + '.txt?t=' + Date.now());
      if (!r.ok) throw new Error('Chunk ' + i + ' failed (' + r.status + ')');
      b64 += (await r.text()).trim();
    }
    st.textContent = 'Unpacking…';
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const html = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    st.textContent = 'Failed: ' + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
