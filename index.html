<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>ISO League</title></head>
<body style="margin:0;background:#060b14;color:#e2e8f0;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh">
<p id="st">Loading ISO League...</p>
<script>
(async function(){
  const n=12; const st=document.getElementById('st');
  try{
    let b64='';
    for(let i=0;i<n;i++){
      st.textContent='Loading... '+(i+1)+'/'+n;
      const name='c'+String(i).padStart(2,'0')+'.txt';
      const r=await fetch(name);
      if(!r.ok) throw new Error('Missing '+name);
      b64+=(await r.text()).trim();
    }
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){st.textContent='Failed: '+e;console.error(e);}
})();
</script></body></html>
