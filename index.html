<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ISO League — Official Broadcast Suite</title>
</head>
<body style="margin:0;background:#060b14;color:#e2e8f0;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
<p id="st">Loading ISO League…</p>
<script>
(async function() {
  const n = 4;
  const st = document.getElementById('st');
  try {
    let b64 = '';
    for (let i = 0; i < n; i++) {
      st.textContent = 'Loading ISO League… ' + (i+1) + '/' + n;
      const r = await fetch('payload' + i + '.txt');
      if (!r.ok) throw new Error('Missing payload' + i + '.txt');
      b64 += await r.text();
    }
    const bin = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bin]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    st.textContent = 'Failed to load app: ' + e;
    console.error(e);
  }
})();
</script>
</body>
</html>
